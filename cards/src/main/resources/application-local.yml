server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

build:
  version: "local"

cards:
  message: "Welcome to Microservice cards related local APIs"
  contactDetails:
    name: "Local Dev"
    email: "local@microservice.com"
  onCallSupport:
    - "(000) 000-0000"
    - "(111) 111-1111"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
