spring:
  application:
    name: accounts
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: "optional:configserver:http://localhost:8071,optional:configserver:http://configserver:8071"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true

endpoints:
  shutdown:
    enabled: true

eureka:
  instance:
    preferIpAdress: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
info:
  app:
    name: accounts
    description: Microservice Accounts Application
    version: 1.0.0
