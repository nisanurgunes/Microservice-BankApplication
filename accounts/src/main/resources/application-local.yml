spring:
  datasource:
    url: jdbc:mysql://localhost:3307/accountsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

build:
  version: "local"

accounts:
  message: "Welcome to Microservice accounts related local APIs"
  contactDetails:
    name: "Local Dev"
    email: "local@microservice.com"
  onCallSupport:
    - "(000) 000-0000"
    - "(111) 111-1111"

address:
  defaultBranchAddress: "123 Main St, Localhost"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8070/eureka/
