server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://accountsdb:3306/accountsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

sql:
  init:
    mode: always

management:
  endpoints:
    web:
      exposure:
        include: "*"

address:
  defaultBranchAddress: "123 Main St, Anytown, USA"

build:
  version: "3.0"
accounts:
  message: "Welcome to Microservice accounts related local produc APIs "
  contactDetails:
    name: "John Doe - Developer"
    email: "john@microservice.com"
  onCallSupport:
    - (555) 555-1234
    - (555) 523-1345
