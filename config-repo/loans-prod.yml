server:
  port: 8090

spring:
  datasource:
    url: jdbc:mysql://loansdb:3306/loansdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

sql:
  init:
    mode: always

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: "1.0"

loans:
  message: "Welcome to Microservice loans related prod APIs "
