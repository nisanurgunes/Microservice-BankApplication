server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://cardsdb:3306/cardsdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

sql:
  init:
    mode: always

management:
  endpoints:
    web:
      exposure:
        include: "*"

build:
  version: "1.0"

cards:
  message: "Welcome to Microservice cards related production APIs "
  contactDetails:
    name: "Sandra Harald - Product Owner"
    email: "sandra@microservice.com"
  onCallSupport:
    - (617) 432-2356
    - (936) 564-8721
