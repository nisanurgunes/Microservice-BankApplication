spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
        #native:
         # search-locations: "file:///C:/Users/gunes/Desktop/Users/microservice/Documents/config"
        git:
          uri: "https://github.com/nisanurgunes/Microservice-BankApplication.git"
          default-label: new-master
          timeout: 5
          clone-on-start: true
          force-pull: true
          search-paths: config

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true


server:
  port: 8071
