spring:
  application:
    name: "configserver"
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/nisanurgunes/Microservice-BankApplication.git"
          search-paths: "config-repo"
          default-label: new-master
          clone-on-start: true
          timeout: 5
          force-pull: true
          refresh-rate: 0


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessState:
      enabled: true
    livenessState:
      enabled: true


server:
  port: 8071
